sonar.sources=src
sonar.tests=tests

# The i18n dictionaries (en.ts / pt.ts) are intentionally parallel: AGENTS.md
# mandates compile-time key parity between locales, so they are near-identical
# by design. Exclude them from copy-paste (duplication) detection.
sonar.cpd.exclusions=src/shared/i18n/dictionaries/**
