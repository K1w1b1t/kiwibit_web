name: Supabase Migrations Deploy

# Applies Prisma migrations and ensures the admin user on every push to
# `release` (staging DB) and `main` (production DB).
#
# Secrets are read from GitHub Environments:
#   Environment "Preview"    (branch release / staging)
#   Environment "Production" (branch main / production)
#
# Per-environment secrets (same names in both environments):
#   SUPABASE_DB_URL  - DB connection string (Session pooler, port 5432, ?sslmode=require)
#   ADMIN_PASSWORD   - admin password
# Optional per-environment secret:
#   ADMIN_EMAIL      - admin email (defaults to admin@kiwibit.dev)

on:
  push:
    branches:
      - release
      - main
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - 'prisma/seed-admin.mjs'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-release:
    name: Migrate + ensure admin (staging)
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: Preview
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        run: |
          test -n "$DATABASE_URL" || { echo "Missing SUPABASE_DB_URL (Preview env)"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "Missing ADMIN_PASSWORD (Preview env)"; exit 1; }

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Ensure admin user
        run: npm run prisma:seed:admin

  migrate-prod:
    name: Migrate + ensure admin (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        run: |
          test -n "$DATABASE_URL" || { echo "Missing SUPABASE_DB_URL (Production env)"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "Missing ADMIN_PASSWORD (Production env)"; exit 1; }

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Ensure admin user
        run: npm run prisma:seed:admin
