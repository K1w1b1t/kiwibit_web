services:
  db:
    image: postgres:16-alpine
    container_name: kiwibit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5433:5432'
    volumes:
      - kiwibit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    image: localstack/localstack:3.8
    container_name: kiwibit-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: ${LOCAL_S3_REGION:-us-east-1}
      LOCALSTACK_S3_BUCKET: ${LOCAL_S3_BUCKET:-kiwibit-local}
      PERSISTENCE: 1
    ports:
      - '4566:4566'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/01-create-bucket.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3api list-buckets >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kiwibit_postgres_data:
  localstack_data:
